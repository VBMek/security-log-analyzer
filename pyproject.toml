[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyzer"
version = "0.1.0"
description = "Security log analysis CLI — detects brute force, SQLi, path traversal, scanning, rate abuse and correlates findings across files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.5.0", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["loganalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# asserts are the point of a test suite; subprocess calls use fixed args
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
files = ["loganalyzer", "tests"]
strict = true

# Tests stay pragmatic: they construct fixtures, not production code.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
